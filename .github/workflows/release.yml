name: Release

# Push a tag to get installers people can download:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The release is created as a draft, so nothing becomes public until you say so.
# Running this by hand from the Actions tab instead builds the same installers
# and leaves them as workflow artifacts, which is the way to try a build without
# announcing one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    # Needed to create the release and attach the installers to it.
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The first build compiles the whole Tauri dependency tree; later ones
      # only compile what changed.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `beforeBuildCommand` in tauri.conf.json compiles the server into
      # src-tauri/binaries first, so there is no separate step for it.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Desktop ComfyUI Server __VERSION__
          releaseDraft: true
          prerelease: false
          releaseBody: |
            Download `ComfyUI-Server_..._x64-setup.exe` and run it.

            The installer is not code signed, so Windows will show
            "Windows protected your PC" — choose **More info → Run anyway**.

      - name: Keep the installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
